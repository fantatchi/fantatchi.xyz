baseURL = "https://fantatchi-xyz.pages.dev/"
title = "fantatchi's notes"
theme = "PaperMod"
languageCode = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true
# 日本語を文字単位で数える（読了時間・抜粋の長さが正しくなる）
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "auto"
  DateFormat = "2006年1月2日"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowPageNums = true
  ShowToc = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShareButtons = ["x","facebook","linkedin"]

  [params.homeInfoParams]
    Title = "fantatchi's notes"
    Content = "日常スケッチ - 日々の小さな気づきから"
    imageUrl = "/images/avatar.png"
    imageTitle = "avatar"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/fantatchi"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/fantatchi"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name = "カテゴリ"
    url  = "/categories/"
    weight = 10

  [[menu.main]]
    name = "タグ"
    url  = "/tags/"
    weight = 20

  [[menu.main]]
    name = "アーカイブ"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    name = "検索"
    url = "/search/"
    weight = 40


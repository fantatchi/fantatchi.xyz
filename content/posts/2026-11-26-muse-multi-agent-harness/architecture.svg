<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 710" width="760" height="710" role="img" aria-labelledby="t d">
  <title id="t">構成図</title>
  <desc id="d">私がスマホやWebから大まかな指示を出すと、クラウドの司令塔 Muse が Tailscale 経由で自宅 PC に接続し、muse-run が tmux の中で Claude Code・Codex・agy のどれか 1 つを起動する。agent はプロジェクトと .claude/ の状態ファイルを読み書きする。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; fill: #1f2937; }
    .main { font-size: 19px; font-weight: bold; }
    .sub { font-size: 15px; }
    .label { font-size: 15px; fill: #374151; }
    .mono { font-family: "Consolas", "Menlo", monospace; font-size: 15px; }
    .box { stroke: #374151; stroke-width: 2; }
    .line { stroke: #374151; stroke-width: 2; fill: none; }
  </style>

  <!-- 背景 -->
  <rect x="0" y="0" width="760" height="710" rx="12" fill="#ffffff"/>

  <!-- 私 -->
  <rect class="box" x="230" y="20" width="300" height="56" rx="10" fill="#fef3c7"/>
  <text class="main" x="380" y="55" text-anchor="middle">私（スマホ / Web）</text>

  <line class="line" x1="380" y1="76" x2="380" y2="132" marker-end="url(#arrow)"/>
  <text class="label" x="396" y="110">大まかな指示</text>

  <!-- Muse -->
  <rect class="box" x="180" y="136" width="400" height="80" rx="10" fill="#e0e7ff"/>
  <text class="main" x="380" y="170" text-anchor="middle">Muse：司令塔（クラウド）</text>
  <text class="sub" x="380" y="198" text-anchor="middle">作業はせず、agent を選んで任せる</text>

  <line class="line" x1="380" y1="216" x2="380" y2="272" marker-end="url(#arrow)"/>
  <text class="label" x="396" y="250">Tailscale で安全に接続</text>

  <!-- 自宅 PC -->
  <rect class="box" x="30" y="276" width="700" height="410" rx="14" fill="#f3f4f6" stroke-dasharray="8 5"/>
  <text class="main" x="56" y="310">自宅 PC（Windows + WSL）</text>

  <rect class="box" x="230" y="326" width="300" height="56" rx="10" fill="#ffffff"/>
  <text class="sub" x="380" y="360" text-anchor="middle">muse-run が tmux の中で起動</text>

  <path class="line" d="M380,382 V400 M165,400 H595"/>
  <line class="line" x1="165" y1="400" x2="165" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="380" y1="400" x2="380" y2="418" marker-end="url(#arrow)"/>
  <line class="line" x1="595" y1="400" x2="595" y2="418" marker-end="url(#arrow)"/>

  <!-- agents -->
  <text class="label" x="546" y="380">どれか 1 つを起動</text>
  <rect class="box" x="70" y="422" width="190" height="60" rx="10" fill="#dcfce7"/>
  <text class="main" x="165" y="458" text-anchor="middle">Claude Code</text>
  <rect class="box" x="285" y="422" width="190" height="60" rx="10" fill="#dcfce7"/>
  <text class="main" x="380" y="458" text-anchor="middle">Codex</text>
  <rect class="box" x="500" y="422" width="190" height="60" rx="10" fill="#dcfce7"/>
  <text class="main" x="595" y="458" text-anchor="middle">agy</text>

  <path class="line" d="M165,482 V504 M380,482 V504 M595,482 V504 M165,504 H595"/>
  <line class="line" x1="380" y1="504" x2="380" y2="532" marker-end="url(#arrow)"/>
  <text class="label" x="396" y="524">読み書き</text>

  <!-- project -->
  <rect class="box" x="110" y="536" width="540" height="124" rx="10" fill="#ffffff"/>
  <text class="main" x="380" y="568" text-anchor="middle">プロジェクト <tspan class="mono">~/work/&lt;name&gt;</tspan></text>
  <rect class="box" x="150" y="584" width="460" height="60" rx="8" fill="#fce7f3"/>
  <text class="sub" x="380" y="608" text-anchor="middle"><tspan class="mono">.claude/</tspan>（状態はここにだけ残る）</text>
  <text class="mono" x="380" y="632" text-anchor="middle">context.md / tasks.md / handoff.md</text>
</svg>
